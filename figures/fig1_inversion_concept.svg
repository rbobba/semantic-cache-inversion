<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <style>
    text { font-size: 13px; fill: #333; }
    .title { font-size: 16px; font-weight: 600; fill: #1a1a1a; }
    .subtitle { font-size: 12px; fill: #666; }
    .label { font-size: 11px; fill: #555; }
    .axis-label { font-size: 11px; fill: #888; }
    .bold { font-weight: 600; }
    .danger { fill: #c0392b; }
    .safe { fill: #27ae60; }
    .neutral { fill: #7f8c8d; }
  </style>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" class="title">The Inversion: Period Swap vs. Rewording</text>
  <text x="360" y="46" text-anchor="middle" class="subtitle">Cosine similarity to cached question "What were my overall expenses this year?" (mpnet)</text>

  <!-- Axis -->
  <line x1="100" y1="280" x2="680" y2="280" stroke="#ccc" stroke-width="1"/>
  <!-- Ticks -->
  <line x1="158" y1="276" x2="158" y2="284" stroke="#ccc"/>
  <text x="158" y="298" text-anchor="middle" class="axis-label">0.80</text>
  <line x1="274" y1="276" x2="274" y2="284" stroke="#ccc"/>
  <text x="274" y="298" text-anchor="middle" class="axis-label">0.85</text>
  <line x1="390" y1="276" x2="390" y2="284" stroke="#ccc"/>
  <text x="390" y="298" text-anchor="middle" class="axis-label">0.90</text>
  <line x1="506" y1="276" x2="506" y2="284" stroke="#ccc"/>
  <text x="506" y="298" text-anchor="middle" class="axis-label">0.95</text>
  <line x1="622" y1="276" x2="622" y2="284" stroke="#ccc"/>
  <text x="622" y="298" text-anchor="middle" class="axis-label">1.00</text>
  <text x="390" y="328" text-anchor="middle" class="axis-label">Cosine similarity</text>

  <!-- Grid lines -->
  <line x1="158" y1="70" x2="158" y2="275" stroke="#f0f0f0" stroke-width="1"/>
  <line x1="274" y1="70" x2="274" y2="275" stroke="#f0f0f0" stroke-width="1"/>
  <line x1="390" y1="70" x2="390" y2="275" stroke="#f0f0f0" stroke-width="1"/>
  <line x1="506" y1="70" x2="506" y2="275" stroke="#f0f0f0" stroke-width="1"/>
  <line x1="622" y1="70" x2="622" y2="275" stroke="#f0f0f0" stroke-width="1"/>

  <!-- Period swap (WRONG) - scores 0.984 -->
  <circle cx="612" cy="100" r="8" fill="#c0392b" opacity="0.85"/>
  <text x="600" y="85" text-anchor="end" class="label danger bold">0.984</text>
  <text x="600" y="118" text-anchor="end" class="label">"...my overall expenses <tspan class="bold danger">last</tspan> year?"</text>
  <text x="600" y="133" text-anchor="end" class="label danger">(wrong answer — one word changed)</text>

  <!-- Best rewording (CORRECT) - scores 0.875 -->
  <circle cx="360" cy="185" r="8" fill="#27ae60" opacity="0.85"/>
  <text x="348" y="170" text-anchor="end" class="label safe bold">0.875</text>
  <text x="348" y="203" text-anchor="end" class="label">"What was my <tspan class="bold safe">total spending</tspan> last year?"</text>
  <text x="348" y="218" text-anchor="end" class="label safe">(correct — same meaning, different words)</text>

  <!-- The gap annotation -->
  <line x1="375" y1="185" x2="597" y2="185" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="612" y1="115" x2="612" y2="275" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Bracket showing the inversion -->
  <path d="M 630 110 Q 650 148 630 185" fill="none" stroke="#e74c3c" stroke-width="2"/>
  <text x="658" y="145" class="label danger bold">Inverted</text>
  <text x="658" y="160" class="label danger">No threshold</text>
  <text x="658" y="175" class="label danger">is safe here</text>

  <!-- Other rewordings cluster -->
  <circle cx="290" cy="235" r="5" fill="#27ae60" opacity="0.5"/>
  <circle cx="320" cy="245" r="5" fill="#27ae60" opacity="0.5"/>
  <circle cx="340" cy="255" r="5" fill="#27ae60" opacity="0.5"/>
  <circle cx="265" cy="250" r="5" fill="#27ae60" opacity="0.5"/>
  <text x="240" y="270" class="label neutral">other correct rephrasings</text>
</svg>
