<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-size: 13px; fill: #333; }
    .title { font-size: 16px; font-weight: 600; fill: #1a1a1a; }
    .subtitle { font-size: 12px; fill: #666; }
    .label { font-size: 11px; fill: #555; }
    .axis-label { font-size: 11px; fill: #888; }
    .bold { font-weight: 600; }
    .danger { fill: #c0392b; }
    .safe { fill: #27ae60; }
    .neutral { fill: #7f8c8d; }
  </style>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" class="title">The Inversion: Period Swap vs. Rewording</text>
  <text x="380" y="46" text-anchor="middle" class="subtitle">Cosine similarity to cached question "What were my overall expenses this year?" (mpnet)</text>

  <!--
    Axis: similarity 0.80 to 1.00
    x=120 is 0.80, x=680 is 1.00.  width=560, range=0.20, per 0.01=28px
    0.875 → x=330    0.984 → x=635
  -->

  <!-- Axis line -->
  <line x1="120" y1="290" x2="680" y2="290" stroke="#bbb" stroke-width="1"/>

  <!-- Ticks and labels -->
  <line x1="120" y1="286" x2="120" y2="294" stroke="#bbb"/>
  <text x="120" y="310" text-anchor="middle" class="axis-label">0.80</text>
  <line x1="260" y1="286" x2="260" y2="294" stroke="#bbb"/>
  <text x="260" y="310" text-anchor="middle" class="axis-label">0.85</text>
  <line x1="400" y1="286" x2="400" y2="294" stroke="#bbb"/>
  <text x="400" y="310" text-anchor="middle" class="axis-label">0.90</text>
  <line x1="540" y1="286" x2="540" y2="294" stroke="#bbb"/>
  <text x="540" y="310" text-anchor="middle" class="axis-label">0.95</text>
  <line x1="680" y1="286" x2="680" y2="294" stroke="#bbb"/>
  <text x="680" y="310" text-anchor="middle" class="axis-label">1.00</text>
  <text x="400" y="340" text-anchor="middle" class="axis-label">Cosine similarity</text>

  <!-- Grid lines (light) -->
  <line x1="120" y1="65" x2="120" y2="285" stroke="#eee"/>
  <line x1="260" y1="65" x2="260" y2="285" stroke="#eee"/>
  <line x1="400" y1="65" x2="400" y2="285" stroke="#eee"/>
  <line x1="540" y1="65" x2="540" y2="285" stroke="#eee"/>
  <line x1="680" y1="65" x2="680" y2="285" stroke="#eee"/>

  <!-- === Period swap (WRONG): 0.984 → x=635 === -->
  <circle cx="635" cy="110" r="8" fill="#c0392b" opacity="0.85"/>
  <text x="620" y="95" text-anchor="end" class="label danger bold">0.984</text>
  <text x="620" y="128" text-anchor="end" class="label">"...my overall expenses</text>
  <text x="620" y="143" text-anchor="end" class="label"><tspan class="bold danger">last</tspan> year?"</text>
  <text x="620" y="160" text-anchor="end" class="label danger">(wrong — one word changed)</text>

  <!-- === Best rewording (CORRECT): 0.875 → x=330 === -->
  <circle cx="330" cy="195" r="8" fill="#27ae60" opacity="0.85"/>
  <text x="345" y="180" class="label safe bold">0.875</text>
  <text x="345" y="213" class="label">"What was my <tspan class="bold safe">total spending</tspan></text>
  <text x="345" y="228" class="label">last year?"</text>
  <text x="345" y="245" class="label safe">(correct — same meaning)</text>

  <!-- Vertical dashed lines from dots to axis -->
  <line x1="635" y1="120" x2="635" y2="285" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.35"/>
  <line x1="330" y1="205" x2="330" y2="285" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.35"/>

  <!-- Bracket showing the inversion gap -->
  <path d="M 650 118 Q 672 155 650 192" fill="none" stroke="#e74c3c" stroke-width="2"/>
  <text x="660" y="138" class="label danger bold">Inverted:</text>
  <text x="660" y="153" class="label danger">no threshold</text>
  <text x="660" y="168" class="label danger">is safe here</text>

  <!-- Other correct rephrasings: 0.83–0.86 → x=204..288 -->
  <circle cx="204" cy="260" r="5" fill="#27ae60" opacity="0.4"/>
  <circle cx="232" cy="265" r="5" fill="#27ae60" opacity="0.4"/>
  <circle cx="260" cy="268" r="5" fill="#27ae60" opacity="0.4"/>
  <circle cx="288" cy="263" r="5" fill="#27ae60" opacity="0.4"/>
  <circle cx="218" cy="270" r="5" fill="#27ae60" opacity="0.4"/>
  <text x="175" y="285" class="label neutral">other correct rephrasings</text>

  <!-- Direction labels -->
  <text x="155" y="355" class="axis-label">lower similarity</text>
  <text x="620" y="355" class="axis-label">higher similarity</text>
</svg>
