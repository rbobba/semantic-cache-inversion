<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="system-ui, -apple-system, sans-serif">
  <style>
    text { font-size: 12px; fill: #333; }
    .title { font-size: 16px; font-weight: 600; fill: #1a1a1a; }
    .subtitle { font-size: 12px; fill: #666; }
    .model-label { font-size: 10.5px; fill: #444; text-anchor: end; }
    .axis-label { font-size: 10px; fill: #888; }
    .annotation { font-size: 11px; fill: #c0392b; font-style: italic; }
    .legend-label { font-size: 10px; fill: #555; }
  </style>

  <text x="380" y="28" text-anchor="middle" class="title">Can Similarity Tell a Rewording from a Period Change?</text>
  <text x="380" y="46" text-anchor="middle" class="subtitle">AUC on 480 human-written questions. 0.5 = coin toss. All 15 models cluster near chance.</text>

  <!--
    Axis: AUC 0.40 to 0.75
    x=150 is 0.40, x=660 is 0.75
    width=510 for range 0.35, so per 0.01 = 14.57px

    Key positions:
    0.40 = 150    0.45 = 223    0.50 = 296
    0.55 = 369    0.60 = 441    0.65 = 514
    0.70 = 587    0.75 = 660
    Coin toss (0.50) = 296
  -->

  <!-- Axis line -->
  <line x1="150" y1="385" x2="660" y2="385" stroke="#bbb" stroke-width="1"/>

  <!-- Ticks -->
  <line x1="150" y1="381" x2="150" y2="389" stroke="#bbb"/>
  <text x="150" y="403" text-anchor="middle" class="axis-label">0.40</text>
  <line x1="223" y1="381" x2="223" y2="389" stroke="#bbb"/>
  <text x="223" y="403" text-anchor="middle" class="axis-label">0.45</text>
  <line x1="296" y1="381" x2="296" y2="389" stroke="#bbb"/>
  <text x="296" y="403" text-anchor="middle" class="axis-label">0.50</text>
  <line x1="369" y1="381" x2="369" y2="389" stroke="#bbb"/>
  <text x="369" y="403" text-anchor="middle" class="axis-label">0.55</text>
  <line x1="441" y1="381" x2="441" y2="389" stroke="#bbb"/>
  <text x="441" y="403" text-anchor="middle" class="axis-label">0.60</text>
  <line x1="514" y1="381" x2="514" y2="389" stroke="#bbb"/>
  <text x="514" y="403" text-anchor="middle" class="axis-label">0.65</text>
  <line x1="587" y1="381" x2="587" y2="389" stroke="#bbb"/>
  <text x="587" y="403" text-anchor="middle" class="axis-label">0.70</text>
  <line x1="660" y1="381" x2="660" y2="389" stroke="#bbb"/>
  <text x="660" y="403" text-anchor="middle" class="axis-label">0.75</text>
  <text x="405" y="428" text-anchor="middle" class="axis-label">AUC (area under ROC curve)</text>

  <!-- Coin-toss line at 0.50 = x=296 -->
  <line x1="296" y1="70" x2="296" y2="380" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
  <text x="300" y="83" class="annotation">coin toss (0.50)</text>

  <!-- Grid lines -->
  <line x1="150" y1="85" x2="150" y2="380" stroke="#f5f5f5"/>
  <line x1="223" y1="85" x2="223" y2="380" stroke="#f5f5f5"/>
  <line x1="369" y1="85" x2="369" y2="380" stroke="#f5f5f5"/>
  <line x1="441" y1="85" x2="441" y2="380" stroke="#f5f5f5"/>
  <line x1="514" y1="85" x2="514" y2="380" stroke="#f5f5f5"/>
  <line x1="587" y1="85" x2="587" y2="380" stroke="#f5f5f5"/>
  <line x1="660" y1="85" x2="660" y2="380" stroke="#f5f5f5"/>

  <!--
    Per 0.01 = 14.57px.  x = 150 + (AUC - 0.40) * 1457.1

    Row data (AUC [low, high]):
     1. MiniLM       0.526 [0.449, 0.608]  → dot=334  CI=221..453
     2. mpnet         0.522 [0.443, 0.604]  → dot=328  CI=213..447
     3. bge           0.580 [0.507, 0.655]  → dot=412  CI=306..522
     4. e5            0.581 [0.506, 0.662]  → dot=414  CI=304..532
     5. Qwen3         0.595 [0.519, 0.677]  → dot=434  CI=323..554
     6. Snowflake     0.561 [0.486, 0.639]  → dot=385  CI=275..498
     7. mxbai         0.545 [0.474, 0.619]  → dot=361  CI=258..469
     8. text-emb-004  0.524 [0.449, 0.602]  → dot=331  CI=221..444
     9. t-e-004 SS    0.559 [0.480, 0.639]  → dot=382  CI=267..498
    10. gemini-emb    0.559 [0.480, 0.634]  → dot=382  CI=267..491
    11. OAI 3-small   0.581 [0.505, 0.665]  → dot=414  CI=303..536
    12. OAI 3-large   0.594 [0.513, 0.681]  → dot=433  CI=315..559
    13. voyage-3-lg   0.595 [0.520, 0.672]  → dot=434  CI=325..546
    14. voyage-3.5    0.550 [0.475, 0.628]  → dot=369  CI=259..482
    15. voyage-4      0.595 [0.528, 0.671]  → dot=434  CI=337..545
  -->

  <!-- Row 1: MiniLM  y=100 -->
  <text x="138" y="104" class="model-label">MiniLM-L6-v2</text>
  <line x1="221" y1="100" x2="453" y2="100" stroke="#2980b9" stroke-width="2" opacity="0.45"/>
  <circle cx="334" cy="100" r="5" fill="#2980b9"/>

  <!-- Row 2: mpnet  y=120 -->
  <text x="138" y="124" class="model-label">mpnet-base-v2</text>
  <line x1="213" y1="120" x2="447" y2="120" stroke="#2980b9" stroke-width="2" opacity="0.45"/>
  <circle cx="328" cy="120" r="5" fill="#2980b9"/>

  <!-- Row 3: bge  y=140 -->
  <text x="138" y="144" class="model-label">bge-base-en-v1.5</text>
  <line x1="306" y1="140" x2="522" y2="140" stroke="#2980b9" stroke-width="2" opacity="0.45"/>
  <circle cx="412" cy="140" r="5" fill="#2980b9"/>

  <!-- Row 4: e5  y=160 -->
  <text x="138" y="164" class="model-label">e5-base-v2</text>
  <line x1="304" y1="160" x2="532" y2="160" stroke="#2980b9" stroke-width="2" opacity="0.45"/>
  <circle cx="414" cy="160" r="5" fill="#2980b9"/>

  <!-- Row 5: Qwen3  y=180 -->
  <text x="138" y="184" class="model-label">Qwen3-0.6B</text>
  <line x1="323" y1="180" x2="554" y2="180" stroke="#8e44ad" stroke-width="2" opacity="0.45"/>
  <circle cx="434" cy="180" r="5" fill="#8e44ad"/>

  <!-- Row 6: Snowflake  y=200 -->
  <text x="138" y="204" class="model-label">Snowflake Arctic</text>
  <line x1="275" y1="200" x2="498" y2="200" stroke="#8e44ad" stroke-width="2" opacity="0.45"/>
  <circle cx="385" cy="200" r="5" fill="#8e44ad"/>

  <!-- Row 7: mxbai  y=220 -->
  <text x="138" y="224" class="model-label">mxbai-embed-large</text>
  <line x1="258" y1="220" x2="469" y2="220" stroke="#8e44ad" stroke-width="2" opacity="0.45"/>
  <circle cx="361" cy="220" r="5" fill="#8e44ad"/>

  <!-- Row 8: text-embedding-004  y=240 -->
  <text x="138" y="244" class="model-label">text-emb-004</text>
  <line x1="221" y1="240" x2="444" y2="240" stroke="#e67e22" stroke-width="2" opacity="0.45"/>
  <circle cx="331" cy="240" r="5" fill="#e67e22"/>

  <!-- Row 9: text-emb-004 SemSim  y=260 -->
  <text x="138" y="264" class="model-label">text-emb-004 SS</text>
  <line x1="267" y1="260" x2="498" y2="260" stroke="#e67e22" stroke-width="2" opacity="0.45"/>
  <circle cx="382" cy="260" r="5" fill="#e67e22"/>

  <!-- Row 10: gemini-embedding  y=280 -->
  <text x="138" y="284" class="model-label">gemini-emb-001</text>
  <line x1="267" y1="280" x2="491" y2="280" stroke="#e67e22" stroke-width="2" opacity="0.45"/>
  <circle cx="382" cy="280" r="5" fill="#e67e22"/>

  <!-- Row 11: OAI 3-small  y=300 -->
  <text x="138" y="304" class="model-label">OAI 3-small</text>
  <line x1="303" y1="300" x2="536" y2="300" stroke="#e67e22" stroke-width="2" opacity="0.45"/>
  <circle cx="414" cy="300" r="5" fill="#e67e22"/>

  <!-- Row 12: OAI 3-large  y=320 -->
  <text x="138" y="324" class="model-label">OAI 3-large</text>
  <line x1="315" y1="320" x2="559" y2="320" stroke="#e67e22" stroke-width="2" opacity="0.45"/>
  <circle cx="433" cy="320" r="5" fill="#e67e22"/>

  <!-- Row 13: voyage-3-large  y=340 -->
  <text x="138" y="344" class="model-label">voyage-3-large</text>
  <line x1="325" y1="340" x2="546" y2="340" stroke="#16a085" stroke-width="2" opacity="0.45"/>
  <circle cx="434" cy="340" r="5" fill="#16a085"/>

  <!-- Row 14: voyage-3.5  y=360 -->
  <text x="138" y="364" class="model-label">voyage-3.5</text>
  <line x1="259" y1="360" x2="482" y2="360" stroke="#16a085" stroke-width="2" opacity="0.45"/>
  <circle cx="369" cy="360" r="5" fill="#16a085"/>

  <!-- Row 15: voyage-4  y=375 (tighter at bottom but above axis) -->
  <text x="138" y="379" class="model-label">voyage-4</text>
  <line x1="337" y1="375" x2="545" y2="375" stroke="#16a085" stroke-width="2" opacity="0.45"/>
  <circle cx="434" cy="375" r="5" fill="#16a085"/>

  <!-- Legend -->
  <circle cx="485" cy="72" r="4" fill="#2980b9"/>
  <text x="494" y="76" class="legend-label">Open (primary)</text>
  <circle cx="580" cy="72" r="4" fill="#8e44ad"/>
  <text x="589" y="76" class="legend-label">Open (secondary)</text>
  <circle cx="485" cy="88" r="4" fill="#e67e22"/>
  <text x="494" y="92" class="legend-label">Google / OpenAI</text>
  <circle cx="580" cy="88" r="4" fill="#16a085"/>
  <text x="589" y="92" class="legend-label">Voyage</text>
</svg>
