<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-size: 12px; fill: #333; }
    .title { font-size: 16px; font-weight: 600; fill: #1a1a1a; }
    .subtitle { font-size: 12px; fill: #666; }
    .section-title { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
    .label { font-size: 10.5px; fill: #444; }
    .val { font-size: 11px; font-weight: 600; }
    .domain-label { font-size: 11px; fill: #555; font-weight: 500; }
    .small { font-size: 9.5px; fill: #888; }
  </style>

  <text x="360" y="28" text-anchor="middle" class="title">From Problem to Solution: The Full-Signature Guard</text>
  <text x="360" y="46" text-anchor="middle" class="subtitle">480 human-written questions, two extractor vendors, results across four domains</text>

  <!-- Column 1: The Problem -->
  <rect x="20" y="65" width="220" height="30" rx="4" fill="#e74c3c" opacity="0.1"/>
  <text x="130" y="85" text-anchor="middle" class="section-title" fill="#c0392b">Similarity Threshold</text>
  <text x="130" y="102" text-anchor="middle" class="small">AUC for separating rewordings</text>
  <text x="130" y="114" text-anchor="middle" class="small">from period changes</text>

  <text x="30" y="142" class="domain-label">Finance</text>
  <rect x="120" y="130" width="100" height="18" rx="3" fill="#e74c3c" opacity="0.15"/>
  <text x="170" y="143" text-anchor="middle" class="val" fill="#c0392b">0.55–0.62</text>

  <text x="30" y="168" class="domain-label">Retail</text>
  <rect x="120" y="156" width="100" height="18" rx="3" fill="#e74c3c" opacity="0.15"/>
  <text x="170" y="169" text-anchor="middle" class="val" fill="#c0392b">0.47–0.64</text>

  <text x="30" y="194" class="domain-label">Healthcare</text>
  <rect x="120" y="182" width="100" height="18" rx="3" fill="#e74c3c" opacity="0.15"/>
  <text x="170" y="195" text-anchor="middle" class="val" fill="#c0392b">0.57–0.74</text>

  <text x="30" y="220" class="domain-label">IT Support</text>
  <rect x="120" y="208" width="100" height="18" rx="3" fill="#e74c3c" opacity="0.15"/>
  <text x="170" y="221" text-anchor="middle" class="val" fill="#c0392b">0.37–0.55</text>

  <text x="130" y="250" text-anchor="middle" class="label" fill="#c0392b">Coin-toss performance.</text>
  <text x="130" y="264" text-anchor="middle" class="label" fill="#c0392b">Cannot tell them apart.</text>

  <!-- Arrow 1 (simple triangle, no marker) -->
  <line x1="248" y1="175" x2="265" y2="175" stroke="#999" stroke-width="2"/>
  <polygon points="265,170 275,175 265,180" fill="#999"/>

  <!-- Column 2: The Solution -->
  <rect x="280" y="65" width="215" height="30" rx="4" fill="#27ae60" opacity="0.1"/>
  <text x="388" y="85" text-anchor="middle" class="section-title" fill="#27ae60">Full-Signature Guard</text>
  <text x="388" y="102" text-anchor="middle" class="small">Correct reuse (%) and wrong reuses</text>
  <text x="388" y="114" text-anchor="middle" class="small">best vendor shown</text>

  <text x="290" y="142" class="domain-label">Finance</text>
  <rect x="378" y="130" width="55" height="18" rx="3" fill="#27ae60" opacity="0.15"/>
  <text x="405" y="143" text-anchor="middle" class="val" fill="#27ae60">93%</text>
  <text x="442" y="143" class="label">1 wrong</text>

  <text x="290" y="168" class="domain-label">Retail</text>
  <rect x="378" y="156" width="55" height="18" rx="3" fill="#27ae60" opacity="0.25"/>
  <text x="405" y="169" text-anchor="middle" class="val" fill="#27ae60">97%</text>
  <text x="442" y="169" class="label" fill="#27ae60" font-weight="600">0 wrong</text>

  <text x="290" y="194" class="domain-label">Healthcare</text>
  <rect x="378" y="182" width="55" height="18" rx="3" fill="#27ae60" opacity="0.15"/>
  <text x="405" y="195" text-anchor="middle" class="val" fill="#27ae60">89%</text>
  <text x="442" y="195" class="label">3–8 wrong</text>

  <text x="290" y="220" class="domain-label">IT Support</text>
  <rect x="378" y="208" width="55" height="18" rx="3" fill="#27ae60" opacity="0.15"/>
  <text x="405" y="221" text-anchor="middle" class="val" fill="#27ae60">86%</text>
  <text x="442" y="221" class="label">0–4 wrong</text>

  <text x="388" y="250" text-anchor="middle" class="label" fill="#27ae60">vs. exact-key cache:</text>
  <text x="388" y="264" text-anchor="middle" class="label" fill="#27ae60">only 1–33% correct reuse</text>

  <!-- Arrow 2 (simple triangle, no marker) -->
  <line x1="500" y1="175" x2="517" y2="175" stroke="#999" stroke-width="2"/>
  <polygon points="517,170 527,175 517,180" fill="#999"/>

  <!-- Column 3: Residual Risk -->
  <rect x="532" y="65" width="175" height="30" rx="4" fill="#e67e22" opacity="0.1"/>
  <text x="620" y="85" text-anchor="middle" class="section-title" fill="#e67e22">Residual Risk</text>
  <text x="620" y="102" text-anchor="middle" class="small">What the guard cannot catch</text>

  <rect x="540" y="125" width="160" height="55" rx="6" fill="#e67e22" opacity="0.08"/>
  <rect x="540" y="125" width="160" height="55" rx="6" fill="none" stroke="#e67e22" stroke-width="1" opacity="0.3"/>
  <text x="620" y="145" text-anchor="middle" class="label" fill="#e67e22" font-weight="600">"The past year"</text>
  <text x="620" y="162" text-anchor="middle" class="small" fill="#e67e22">Rolling 12 months vs calendar year</text>
  <text x="620" y="175" text-anchor="middle" class="small" fill="#e67e22">produces wrong SQL silently</text>

  <rect x="540" y="190" width="160" height="45" rx="6" fill="#e67e22" opacity="0.08"/>
  <rect x="540" y="190" width="160" height="45" rx="6" fill="none" stroke="#e67e22" stroke-width="1" opacity="0.3"/>
  <text x="620" y="208" text-anchor="middle" class="label" fill="#e67e22" font-weight="600">Explicit date ranges</text>
  <text x="620" y="224" text-anchor="middle" class="small" fill="#e67e22">"From Jan 15 to Mar 1"</text>

  <rect x="540" y="245" width="160" height="30" rx="6" fill="#e67e22" opacity="0.08"/>
  <rect x="540" y="245" width="160" height="30" rx="6" fill="none" stroke="#e67e22" stroke-width="1" opacity="0.3"/>
  <text x="620" y="265" text-anchor="middle" class="small" fill="#e67e22">No signature or threshold catches these</text>

  <!-- Bottom summary bar -->
  <rect x="20" y="300" width="690" height="105" rx="8" fill="#f8f9fa" stroke="#ddd"/>

  <text x="360" y="325" text-anchor="middle" class="section-title">The story in one sentence</text>

  <text x="40" y="350" class="label">1. Similarity thresholds cannot distinguish rewordings from period changes (AUC 0.52–0.58, all 15 models).</text>
  <text x="40" y="370" class="label">2. Extracting operation, measure, grouping and exclusion as a cache key: 80–97% correct reuse, near-zero errors.</text>
  <text x="40" y="390" class="label">3. The remaining risk is the period value itself: "the past year" and explicit dates defeat every design tested.</text>
</svg>
